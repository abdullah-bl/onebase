# Push a tag like v0.1.0 to build single-file binaries for every platform and attach them to a
# GitHub release, and to publish the Docker image to ghcr.io. Both get a signed build provenance
# attestation, which `gh attestation verify` checks against this repository.
#
# Actions are pinned to a commit: a tag can be moved to different code, a commit can't.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release
  packages: write # the image
  id-token: write # signing the attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The tag is the version in the code
        # `onebase upgrade` refuses a binary whose version isn't its release's tag.
        run: |
          version="$(bun -e 'import { VERSION } from "./src/version"; console.log(VERSION)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match src/version.ts ($version). Bump the version, or tag v$version."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:assets
      - name: Build binaries
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$target" = "windows-x64" ] && ext=".exe"
            bun build --compile --minify --no-compile-autoload-dotenv --target "bun-$target" src/cli.ts src/engine/action-worker.ts --outfile "release/onebase-$target$ext"
          done
          cd release && sha256sum onebase-* > SHA256SUMS
      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/onebase-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record is an organisation feature; this repository belongs to a user.
          create-storage-record: false
