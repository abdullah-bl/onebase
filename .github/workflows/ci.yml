name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: onebase
          POSTGRES_DB: onebase
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          TEST_POSTGRES_URL: postgres://postgres:onebase@127.0.0.1:5432/onebase
          TEST_LIBSQL_URL: http://127.0.0.1:8080
      - name: Doctor on every example
        run: for d in examples/*/; do echo "== $d"; (cd "$d" && bun ../../src/cli.ts doctor) || exit 1; done
      - name: Site builds
        run: bun site/build.ts
