<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>onebase offline todo</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #1a1a1a; --muted: #777; --line: #e3e3e3; --accent: #3b5bdb; --card: #fff; --danger: #e03131; --warn: #e67700; --ok: #2b8a3e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #999; --line: #2c2c2c; --accent: #748ffc; --card: #1d1d1d; } }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      main { max-width: 520px; margin: 0 auto; padding: 16px; }
      header { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 17px; margin: 0; }
      #banner { border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 12px 0; border: 1px solid var(--line); color: var(--muted); }
      #banner.offline { border-color: var(--warn); color: var(--warn); }
      #banner.replaying { border-color: var(--ok); color: var(--ok); }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; margin: 6px 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
      li.done label { text-decoration: line-through; color: var(--muted); }
      li label { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
      li input[type="checkbox"] { width: 16px; height: 16px; }
      li .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
      form { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
      input[type="text"] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
      form button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      #error { color: var(--danger); font-size: 13px; min-height: 1.2em; }
      .hint { color: var(--muted); font-size: 12px; }
      h2 { font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>onebase offline todo</h1>
        <span id="conn" class="hint">connecting</span>
      </header>
      <div id="banner"></div>
      <ul id="todos"></ul>
      <h2>Done</h2>
      <ul id="dones"></ul>
      <div id="error"></div>
      <form id="form">
        <input id="text" placeholder="Add a todo (works offline too)" autocomplete="off" />
        <button>Add</button>
      </form>
      <p class="hint">
        This client was created with <code>offline: true</code>. Stop the server (Ctrl+C) and keep using the page:
        edits show right away and are queued. Start the server again and the queue replays in order.
      </p>
    </main>
    <script type="module">
      import { OnebaseClient, anyApi as api } from "/_onebase/client.js";

      // offline: true caches the newest query results in localStorage and
      // queues mutations made while disconnected, replaying them in order.
      const client = new OnebaseClient(undefined, { offline: true });
      const $ = (id) => document.getElementById(id);
      const error = (msg) => ($("error").textContent = msg ?? "");

      let conn = "connecting";
      const renderStatus = () => {
        $("conn").textContent = conn;
        const queued = client.queuedMutations;
        const banner = $("banner");
        if (queued > 0) {
          banner.className = "offline";
          banner.textContent = `Offline — ${queued} mutation${queued === 1 ? "" : "s"} waiting to replay.`;
        } else if (conn !== "open") {
          banner.className = "offline";
          banner.textContent = conn === "connecting" ? "Reconnecting…" : "Offline — edits will replay when the server is back.";
        } else {
          banner.className = "replaying";
          banner.textContent = "Live.";
        }
      };
      client.onConnectionChange((s) => {
        conn = s;
        renderStatus();
      });
      setInterval(renderStatus, 500);

      // Every edit shows immediately, even with the server down. The server's
      // result replaces these changes, and they roll back if the mutation fails.
      const lists = (store) => [store.getQuery(api.todos.list, {}) ?? [], store.getQuery(api.todos.done, {}) ?? []];
      const setLists = (store, open, done) => {
        store.setQuery(api.todos.list, {}, open);
        store.setQuery(api.todos.done, {}, done);
      };
      function toggleNow(store, { id }) {
        const [open, done] = lists(store);
        const todo = [...open, ...done].find((t) => t._id === id);
        if (!todo) return;
        const flipped = { ...todo, done: !todo.done };
        const without = (list) => list.filter((t) => t._id !== id);
        if (todo.done) setLists(store, [flipped, ...open], without(done));
        else setLists(store, without(open), [flipped, ...done]);
      }
      function removeNow(store, { id }) {
        const [open, done] = lists(store);
        setLists(store, open.filter((t) => t._id !== id), done.filter((t) => t._id !== id));
      }

      client.onUpdate(api.todos.list, {}, renderOpen, (e) => error(e.message));
      client.onUpdate(api.todos.done, {}, renderDone, (e) => error(e.message));

      function renderOpen(todos) {
        $("todos").replaceChildren(...todos.map((t) => rowEl(t)));
      }
      function renderDone(todos) {
        $("dones").replaceChildren(...todos.map((t) => rowEl(t)));
      }

      function rowEl(todo) {
        const li = document.createElement("li");
        if (todo.done) li.className = "done";
        const check = Object.assign(document.createElement("input"), { type: "checkbox" });
        check.checked = todo.done;
        check.onchange = () => client.mutation(api.todos.toggle, { id: todo._id }, { optimisticUpdate: toggleNow }).catch((e) => error(e.message));
        const label = Object.assign(document.createElement("label"), { textContent: todo.text });
        const del = Object.assign(document.createElement("button"), { className: "del", textContent: "Delete" });
        del.onclick = () => client.mutation(api.todos.remove, { id: todo._id }, { optimisticUpdate: removeNow }).catch((e) => error(e.message));
        // A todo still waiting to be added has no real id for these to use yet.
        check.disabled = del.disabled = Boolean(todo.local);
        li.append(check, label, del);
        return li;
      }

      let localIds = 0;
      $("form").onsubmit = (e) => {
        e.preventDefault();
        error();
        const text = $("text").value.trim();
        if (!text) return;
        $("text").value = "";
        const row = { _id: `local-${++localIds}`, _creationTime: Date.now(), text, done: false, local: true };
        const addNow = (store) => {
          const [open, done] = lists(store);
          setLists(store, [row, ...open], done);
        };
        client.mutation(api.todos.add, { text }, { optimisticUpdate: addNow }).catch((err) => error(err.message));
      };
    </script>
  </body>
</html>
