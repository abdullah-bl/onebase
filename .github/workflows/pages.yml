# Builds site/ (landing page + docs/*.md) and publishes it to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Component pages come from github.com/abdullah-bl/onebase-components, so rebuild daily to
  # pick up its changes. That repository can also trigger a rebuild right away with a
  # repository_dispatch event of type "components-updated".
  schedule:
    - cron: "17 4 * * *"
  repository_dispatch:
    types: [components-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the component packages, whose docs the site includes
        uses: actions/checkout@v4
        with:
          repository: abdullah-bl/onebase-components
          path: site/.components
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun site/build.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
