# Builds site/ (landing page + docs/*.md) and publishes it to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Component pages come from github.com/abdullah-bl/onebase-components, so rebuild daily to
  # pick up its changes. That repository can also trigger a rebuild right away with a
  # repository_dispatch event of type "components-updated".
  schedule:
    - cron: "17 4 * * *"
  repository_dispatch:
    types: [components-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the component packages, whose docs the site includes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abdullah-bl/onebase-components
          path: site/.components
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun site/build.ts
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          # site/dist has a .nojekyll file; newer versions of this action leave dotfiles out unless asked.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
